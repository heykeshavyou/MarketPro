<div class="m-10">
  <h1 class="quicksand font-extrabold text-3xl mb-4">Flash Sales Today</h1>
  <div data-aos-once="true" data-aos="fadeup" data-aos-delay="200">
    <ngx-slick-carousel [config]="slideConfig">
      @for (item of Product; track $index;) {
      <div ngxSlickItem class="mx-3 product cursor-pointer max-w-[200px]">
        <div
          data-aos-once="true"
          data-aos="fade-up"
          [attr.data-aos-delay]="$index * 100"
          class="border-gray-300 rounded-2xl border-1 hover:border-[#1c799b] p-5"
        >
          <div class="flex justify-between items-center z-10">
            <button
              [ngClass]="{
                'text-white bg-[#1c799b]': ProductService.AvailableInWishlist(
                  item.Id
                )
              }"
              (click)="ProductService.AddToWishlist(item)"
              class="hover:bg-[#1c799b] duration-300 p-2 border border-[#1c799b] rounded-full flex justify-center items-center hover:text-white"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                fill="currentColor"
                class="bi bi-heart"
                viewBox="0 0 16 16"
              >
                <path
                  d="m8 2.748-.717-.737C5.6.281 2.514.878 1.4 3.053c-.523 1.023-.641 2.5.314 4.385.92 1.815 2.834 3.989 6.286 6.357 3.452-2.368 5.365-4.542 6.286-6.357.955-1.886.838-3.362.314-4.385C13.486.878 10.4.28 8.717 2.01zM8 15C-7.333 4.868 3.279-3.04 7.824 1.143q.09.083.176.171a3 3 0 0 1 .176-.17C12.72-3.042 23.333 4.867 8 15"
                />
              </svg>
            </button>
            @if (ProductService.IFCart(item.Id)) {
            <button
              class="bg-[#e3f4fa] flex items-center gap-2.5 rounded-full cursor-pointer hover:bg-[#1c799b] hover:text-white transition-all duration-300 font-medium text-[#1c799b] px-4 py-1"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                fill="currentColor"
                class="bi bi-dash"
                viewBox="0 0 16 16"
                (click)="ProductService.AddToCart(item.Id, -1)"
              >
                <path
                  d="M4 8a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7A.5.5 0 0 1 4 8"
                />
              </svg>
              <span>{{ ProductService.GetCartProduct(item.Id) }}</span>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                fill="currentColor"
                class="bi bi-plus"
                viewBox="0 0 16 16"
                (click)="ProductService.AddToCart(item.Id, 1)"
              >
                <path
                  d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"
                />
              </svg>
            </button>
            }@else{
            <button
              (click)="ProductService.AddToCart(item.Id, 1)"
              class="bg-[#e3f4fa] flex items-center gap-2.5 rounded-full cursor-pointer hover:bg-[#1c799b] hover:text-white transition-all duration-300 font-medium text-[#1c799b] px-4 py-1"
            >
              <span>Add </span>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                fill="currentColor"
                class="bi bi-cart"
                viewBox="0 0 16 16"
              >
                <path
                  d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2"
                />
              </svg>
            </button>
            }
          </div>
          <a [routerLink]="['/product', item.Id!]">
            <div class="size-[160px] flex justify-center items-center">
              <img
                [src]="item.Img"
                width="130"
                class="aspect-square object-contain transition-all duration-300"
              />
            </div>
            <div class="my-2 flex justify-start items-center">
              <p class="text-[12px] md:text-[16px] font-medium">
                {{ item.OfferPrice | currency : "INR" }}
              </p>
              <p
                class="text-[12px] md:text-[16px] mx-3 font-medium text-gray-400 line-through"
              >
                {{ item.Price | currency : "INR" }}
              </p>
            </div>
            <div class="text-[12px] font-bold text-gray-500 flex items-start">
              <span class="me-1 flex justify-center items-baseline gap-1"
                >{{ item.Rating.toFixed(1) }}
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="12"
                  fill="#f0b100"
                  class="bi bi-star-fill"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M3.612 15.443c-.386.198-.824-.149-.746-.592l.83-4.73L.173 6.765c-.329-.314-.158-.888.283-.95l4.898-.696L7.538.792c.197-.39.73-.39.927 0l2.184 4.327 4.898.696c.441.062.612.636.282.95l-3.522 3.356.83 4.73c.078.443-.36.79-.746.592L8 13.187l-4.389 2.256z"
                  /></svg
              ></span>

              <span class="mx-1 flex justify-center items-center"
                >({{ item.RatingCount }})</span
              >
            </div>
            <div>
              <p class="quicksand font-black my-2 hover:text-[#1c799b]">
                {{ item.Name }}
              </p>
            </div>
            <div class="h-1 bg-gray-300 rounded-full">
              <div
                class="bg-[#1c799b] h-[100%] rounded-full"
                [ngStyle]="{ width: item.Quantity + '%' }"
              ></div>
            </div>
            <div class="mt-2 text-[12px] font-medium text-gray-700">
              Sold: {{ 100 - item.Quantity }}/100
            </div>
          </a>
        </div>
      </div>
      }
    </ngx-slick-carousel>
  </div>
</div>
