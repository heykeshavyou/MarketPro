<div class="p-3 my-10">
  <h1 class="quicksand font-extrabold text-3xl mb-4">Hot Deals Today's</h1>
  <div class="grid md:grid-cols-3 grid-cols-1 gap-5">
    <div class="col-span-1 bg-[#1c799b] p-10 rounded-2xl  relative">

      <div class="flex flex-col items-start gap-1 ">
       <div class="bg-[#ffcc53] text-[14px] px-3 py-1 my-2 rounded-[5px]">
          Daily & Groceries
        </div>
        <p class="text-2xl font-black quicksand text-white">Deals of the day</p>
        <p class="text-[#2abc79] font-bold">
          Save up to 50% off on your first order
        </p>
        <div
          class="quicksand font-bold text-[14px] flex gap-1.5 items-center my-6"
        >
          <span class="bg-white rounded-[5px] p-2">
            {{ Timer.hour() | number : "2.0-0" }} H
          </span>
          <span> : </span>
          <span class="bg-white rounded-[5px] p-2">
            {{ Timer.min() | number : "2.0-0" }} M
          </span>
          <span> : </span>
          <span class="bg-white rounded-[5px] p-2">
            {{ Timer.sec() | number : "2.0-0" }} S
          </span>
        </div>
        <button class="btn-primary mb-10">
          <p>Explore Shop</p>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="bi bi-cart"
            viewBox="0 0 16 16"
          >
            <path
              d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2"
            />
          </svg>
        </button>
      </div>
 
        <img src="/basket-img.png" class="absolute bottom-0 right-0 " width="200px"/>
      </div>
    <div class="col-span-2">
          <div data-aos-once="true" data-aos="fadeup" data-aos-delay="200">
    <ngx-slick-carousel [config]="slideConfig">
      @for (item of Products; track $index;) {
      <div ngxSlickItem class="mx-3 product cursor-pointer max-w-[240px]">
        <Product-Card [item]="item" [index]="$index*100"></Product-Card>
      </div>
      }
    </ngx-slick-carousel>
  </div>
    </div>
  </div>
</div>
