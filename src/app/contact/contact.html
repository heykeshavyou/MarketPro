<app-bread-crumb title="Contact"></app-bread-crumb>
<div class="my-5">
  <div class="grid lg:grid-cols-3 grid-cols-1 gap-5 p-5">
    <div class="col-span-2">
      <div class="border border-gray-300 rounded-[10px] px-7 py-5">
        <h1 class="quicksand text-[20px] font-black">Make Custom Request</h1>
        <div class="grid lg:grid-cols-2 grid-cols-1 text-[14px] my-4 gap-4">
          <div>
            <label
              class=" font-black quicksand"
              [htmlFor]="'Name'"
              class="block"
            >
              Full Name
              <span class="text-red-600"> * </span>
            </label>
            <input
              placeholder="Full Name"
              type="text"
              id="Name"
              class="contact-input"
            />
          </div>
          <div>
            <label
              class="text-[14px] font-black quicksand"
              [htmlFor]="'Email'"
              class="block"
            >
              Email Address
              <span class="text-red-600"> * </span>
            </label>
            <input
              placeholder="Email Address"
              type="text"
              id="Email"
              class="contact-input"
            />
          </div>
          <div>
            <label
              class="text-[14px] font-black quicksand"
              [htmlFor]="'Phone'"
              class="block"
            >
              Phone Number
              <span class="text-red-600"> * </span>
            </label>
            <input
              type="text"
              id="Phone"
              class="contact-input"
              placeholder="Phone Number"
            />
          </div>
          <div>
            <label
              class="text-[14px] font-black quicksand"
              [htmlFor]="'Subject'"
              class="block"
            >
              Subject
              <span class="text-red-600"> * </span>
            </label>
            <input type="text" id="Subject" class="contact-input"  placeholder="Subject"/>
          </div>
          <div class="col-span-2">
            <label
              class="text-[14px] font-black quicksand"
              [htmlFor]="
                'Message
'
              "
              class="block"
            >
              Message

              <span class="text-red-600"> * </span>
            </label>
            <textarea
              id="Message"
              placeholder="Message"
            
              class="contact-input h-25"
            ></textarea>
          </div>
        </div>
        <div>
            <button class="btn">
                Sumbit
            </button>
        </div>
      </div>
    </div>
    <div class="col-span-1">
      <div class="border-gray-300 border rounded-[5px] px-7 py-5">
        <h1 class="quicksand text-[20px] font-black">Get In Touch</h1>
        <div class="mt-10">
          <a href="mailto:keshav210305@gmail.com">
            <div class="flex items-center text-hover gap-2.5 mb-3">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                fill="currentColor"
                class="bi bi-envelope"
                viewBox="0 0 16 16"
              >
                <path
                  d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1zm13 2.383-4.708 2.825L15 11.105zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741M1 11.105l4.708-2.897L1 5.383z"
                />
              </svg>
              <p>support@exmaple.com</p>
            </div></a
          >
          <a href="tel:9667167963">
            <div class="flex items-center text-hover gap-2.5 mb-3">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                height="20"
                fill="currentColor"
                class="bi bi-telephone"
                viewBox="0 0 16 16"
              >
                <path
                  d="M3.654 1.328a.678.678 0 0 0-1.015-.063L1.605 2.3c-.483.484-.661 1.169-.45 1.77a17.6 17.6 0 0 0 4.168 6.608 17.6 17.6 0 0 0 6.608 4.168c.601.211 1.286.033 1.77-.45l1.034-1.034a.678.678 0 0 0-.063-1.015l-2.307-1.794a.68.68 0 0 0-.58-.122l-2.19.547a1.75 1.75 0 0 1-1.657-.459L5.482 8.062a1.75 1.75 0 0 1-.46-1.657l.548-2.19a.68.68 0 0 0-.122-.58zM1.884.511a1.745 1.745 0 0 1 2.612.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.68.68 0 0 0 .178.643l2.457 2.457a.68.68 0 0 0 .644.178l2.189-.547a1.75 1.75 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.6 18.6 0 0 1-7.01-4.42 18.6 18.6 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877z"
                />
              </svg>
              <p>+91 9667167963</p>
            </div></a
          >
          <div class="flex items-center text-hover gap-2.5 mb-3">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              fill="currentColor"
              class="bi bi-geo-alt"
              viewBox="0 0 16 16"
            >
              <path
                d="M12.166 8.94c-.524 1.062-1.234 2.12-1.96 3.07A32 32 0 0 1 8 14.58a32 32 0 0 1-2.206-2.57c-.726-.95-1.436-2.008-1.96-3.07C3.304 7.867 3 6.862 3 6a5 5 0 0 1 10 0c0 .862-.305 1.867-.834 2.94M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10"
              />
              <path
                d="M8 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4m0 1a3 3 0 1 0 0-6 3 3 0 0 0 0 6"
              />
            </svg>
            <p>Shahdara, Delhi, India</p>
          </div>
        </div>
      </div>
      <div class="my-4 flex gap-2.5">
        <button class="contact-btn w-1/2">
          <p>Get Support On Call</p>
          <div class="p-2 bg-[#1c799b] rounded-[5px]">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              fill="currentColor"
              class="bi bi-headset"
              viewBox="0 0 16 16"
            >
              <path
                d="M8 1a5 5 0 0 0-5 5v1h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a6 6 0 1 1 12 0v6a2.5 2.5 0 0 1-2.5 2.5H9.366a1 1 0 0 1-.866.5h-1a1 1 0 1 1 0-2h1a1 1 0 0 1 .866.5H11.5A1.5 1.5 0 0 0 13 12h-1a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h1V6a5 5 0 0 0-5-5"
              />
            </svg>
          </div>
        </button>
        <button class="contact-btn w-1/2">
          <p>Get Direction</p>
          <div class="p-2 bg-[#1c799b] rounded-[5px]">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              fill="currentColor"
              class="bi bi-geo-alt"
              viewBox="0 0 16 16"
            >
              <path
                d="M12.166 8.94c-.524 1.062-1.234 2.12-1.96 3.07A32 32 0 0 1 8 14.58a32 32 0 0 1-2.206-2.57c-.726-.95-1.436-2.008-1.96-3.07C3.304 7.867 3 6.862 3 6a5 5 0 0 1 10 0c0 .862-.305 1.867-.834 2.94M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10"
              />
              <path
                d="M8 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4m0 1a3 3 0 1 0 0-6 3 3 0 0 0 0 6"
              />
            </svg>
          </div>
        </button>
      </div>
    </div>
  </div>
</div>
