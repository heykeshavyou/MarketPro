<app-bread-crumb title="Blog"></app-bread-crumb>
<div>
  <div class="grid lg:grid-cols-3 grid-cols-1 p-5 gap-5">
    <div class="col-span-2">
      <img src="blog-img1.png" />
    </div>
    <div class="col-span-1">
      <div class="border-gray-300 border mx-5 p-5 rounded-[10px] mb-3">
        <div class="border-b-gray-300 border-b pb-6">
          <h1 class="quicksand font-black">Search Here</h1>
        </div>
        <div class="my-4 flex">
          <input
            class="bg-[#f1f1f1] w-[100%] p-3 rounded-l-[5px] focus-visible:outline-[#1c799b] placeholder-gray-400"
            placeholder="Search...."
          />
          <button
            class="bg-[#1c799b] p-3 flex justify-center items-center rounded-r-[5px]"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              fill="white"
              class="bi bi-search"
              viewBox="0 0 16 16"
            >
              <path
                d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"
              />
            </svg>
          </button>
        </div>
      </div>
      <div class="border-gray-300 border mx-5 p-5 rounded-[10px] mb-3">
        <div class="border-b-gray-300 border-b pb-6">
          <h1 class="quicksand font-black">Recents Posts</h1>
        </div>
        @for (item of Posts; track $index) {
        <div class="my-3 flex items-center gap-2.5">
          <img [src]="item.img" class="rounded-[10px]" width="100px" />
          <div>
            <p class="quicksand font-bold text-hover">{{ item.title }}</p>
            <div class="my-2 flex gap-1.5">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                fill="#1c799b"
                class="bi bi-calendar-event"
                viewBox="0 0 16 16"
              >
                <path
                  d="M11 6.5a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5z"
                />
                <path
                  d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5M1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4z"
                />
              </svg>
              <p class="text-hover text-[13px] text-gray-400 tracking-wider">
                March 21, 2025
              </p>
            </div>
          </div>
        </div>
        }
      </div>
      <div class="border-gray-300 border mx-5 p-5 rounded-[10px] mb-3">
        <div class="border-b-gray-300 border-b pb-6">
          <h1 class="quicksand font-black">Categories</h1>
        </div>
        @for (item of productService.Categories; track $index) {
        <a [routerLink]="['/shop', { id: item.Id }]">
          <div
            class="border border-gray-300 p-1 cursor-pointer items-center rounded-[5px] my-3 text-[14px] hover:border-[#1c799b] transition-all duration-200 hover:text-[#1c799b] flex justify-between"
          >
            <p class="quicksand ms-2 font-extrabold">{{ item.Name }}</p>
            <button class="bg-[#e3f4fa] p-3 rounded-[5px]">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                fill="#1c799b"
                class="bi bi-arrow-right"
                viewBox="0 0 16 16"
              >
                <path
                  fill-rule="evenodd"
                  d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8"
                />
              </svg>
            </button>
          </div>
        </a>

        }
      </div>
    </div>
  </div>
</div>
<app-info></app-info>
